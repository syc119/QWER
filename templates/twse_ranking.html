{% extends "navbar.html" %}

{% block content %}

<h1>TWSE交易值排行榜</h1>
<p>
    更新時間：
    {{ update_time }}
</p>

<table border="1">

    <tr>
        <th>排名</th>
        <th>代號</th>
        <th>名稱</th>
        <th>交易值</th>
    </tr>

    {% for stock in ranking_data %}

    <tr>
        <td>{{ stock.rank }}</td>
        <td>{{ stock.code }}</td>
        <td>{{ stock.name }}</td>
        <td>{{ stock.value }}</td>
    </tr>

    {% endfor %}

</table>

{% endblock %}
